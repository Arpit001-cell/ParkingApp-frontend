<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · PARKNOVA</title>
<link rel="stylesheet" href="/css/app.css"></head><body><div id="nav"></div><main class="wrap"><div class="card auth"><div class=steps><i class=on></i><i id=s2></i></div><form id=f><div id=p1><label>Name</label><input name=name required><label>Email</label><input name=email type=email required><label>Password (8–72 chars)</label><input name=password type=password minlength=8 maxlength=72 required></div><div id=p2 hidden><label>Account type</label><select name=role id=role><option value=DRIVER>Driver</option><option value=OWNER>Parking Owner</option></select><label>Phone</label><input name=phone required pattern="[0-9]{10,15}" title="Digits only (owner: exactly 10)"><div id=dv><label>Vehicle number</label><input name=vehicleNumber placeholder=MP04AB1234></div></div><button id=nx class=btn style="width:100%;margin-top:18px;justify-content:center">Continue</button></form><p class=mu style=margin-top:14px>Have an account? <a href=/login.html>Login</a></p></div></main><script type="module" src="/js/register.js"></script></body></html>
